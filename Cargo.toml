[package]
name = "sedravasql"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.89"
description = "Experimental safety-first SQLite layer; not production-ready"
license = "Apache-2.0"
repository = "https://github.com/VasiliiBabkin/sedravasql"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.15"
