[package]
name = "sedravasql"
version = "0.1.0-alpha.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Experimental embedded transaction database with reviewable mutations and SQLite backend"
repository = "https://github.com/VasiliiBabkin/sedravasql"
publish = false

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sedravasql-native-engine = { path = "native-engine" }

[[bin]]
name = "sedravasql"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.16"
